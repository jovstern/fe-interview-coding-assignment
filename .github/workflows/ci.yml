name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Static checks only. Unit tests, the build and the recorded browser tests (which need the
# external server) run locally before each PR; their results are in the PR's Checks section.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check src e2e
      - run: npm run lint
      - run: npm run typecheck
